server {
    listen 80;
    server_name api.ardiansyah.app;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name api.ardiansyah.app;
    ssl_certificate /etc/letsencrypt/live/api.ardiansyah.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ardiansyah.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn tracker_connections 20;
    error_page 429 = @limited;
    access_log /var/log/nginx/tracker-api.access.log;
    error_log /var/log/nginx/tracker-api.error.log warn;

    # Overwrite forwarded headers; only this local Nginx is trusted by the API.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 3s;
    proxy_read_timeout 50s;
    proxy_send_timeout 10s;

    location = /v1/transactions/lookup {
        limit_req zone=tracker_lookup burst=5 nodelay;
        proxy_pass http://127.0.0.1:4000;
    }
    location = /v1/overview {
        limit_req zone=tracker_overview burst=5 nodelay;
        proxy_pass http://127.0.0.1:4000;
    }
    location /health/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:4000;
    }
    location /v1/ {
        limit_req zone=tracker_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:4000;
    }
    location / { return 404; }
    location @limited {
        default_type application/json;
        add_header Retry-After 60 always;
        add_header Access-Control-Allow-Origin https://tracker.ardiansyah.app always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Expose-Headers Retry-After always;
        return 429 '{"error":{"code":"RATE_LIMIT_EXCEEDED","message":"Request limit reached. Retry in 60 seconds.","requestId":"$request_id"}}';
    }
}
