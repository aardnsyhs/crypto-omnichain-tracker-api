# Include once inside nginx's http context.
limit_req_zone $binary_remote_addr zone=tracker_api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=tracker_lookup:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=tracker_overview:10m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=tracker_connections:10m;
