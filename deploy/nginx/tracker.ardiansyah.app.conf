server {
    listen 80;
    server_name tracker.ardiansyah.app;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name tracker.ardiansyah.app;
    ssl_certificate /etc/letsencrypt/live/tracker.ardiansyah.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tracker.ardiansyah.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    client_body_timeout 10s;
    keepalive_timeout 30s;
    access_log /var/log/nginx/tracker-web.access.log;
    error_log /var/log/nginx/tracker-web.error.log warn;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_send_timeout 10s;
    }
}
